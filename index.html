<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Athenes — Editor de Relatórios e Artigos Científicos</title>
  <link rel="icon" type="image/svg+xml" href="src/ui/athenes_logo.svg">
  <meta name="theme-color" content="#314F79">
  <meta name="description" content="Ambiente completo para escrever e diagramar relatórios, artigos científicos e documentos acadêmicos em blocos.">

  <!-- Progressive Web App (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Athenes">
  <link rel="apple-touch-icon" href="src/ui/athenes_icon_192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="src/ui/athenes_icon_512.png">

  <style>
    .ath-inicializacao {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: 24px;
      background: #F7F8FB;
      color: #314F79;
      font: 700 14px/1.5 Nunito, system-ui, sans-serif;
      text-align: center;
    }
    .ath-inicializacao p { margin: 0; }
    .ath-inicializacao-indicador {
      box-sizing: border-box;
      width: 52px;
      height: 52px;
      border: 4px solid #DCE6F1;
      border-top-color: #314F79;
      border-radius: 50%;
      animation: ath-inicializacao-girar .9s linear infinite;
    }
    .ath-inicializacao-saindo { pointer-events: none; animation: ath-inicializacao-sair .16s ease-out forwards; }
    @keyframes ath-inicializacao-girar { to { transform: rotate(1turn); } }
    @keyframes ath-inicializacao-sair { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ath-inicializacao-indicador { animation-duration: 2.4s; }
      .ath-inicializacao-saindo { animation-duration: 0s; }
    }
  </style>

  <!-- Folhas de Estilo Athenes (Soft UI + Nunito + Clux.js) -->
  <link rel="stylesheet" href="src/css/athenes_base.css">
  <link rel="stylesheet" href="src/css/athenes_dashboard.css?v=21">
  <link rel="stylesheet" href="src/css/athenes_editor.css?v=16">
  <link rel="stylesheet" href="src/css/athenes_paineis.css?v=2">
  <link rel="stylesheet" href="src/css/athenes_zotero.css">
  <link rel="stylesheet" href="src/css/athenes_estante_3d.css?v=27">
  <link rel="stylesheet" href="src/css/athenes_traducao.css?v=9">
  <link rel="stylesheet" href="src/css/athenes_busca_artigo.css?v=1">
</head>
<body>
  <div id="athenesAppRoot" aria-busy="true"></div>
  <div class="ath-inicializacao" id="athenesInicializacao" role="status">
    <span class="ath-inicializacao-indicador" aria-hidden="true"></span>
    <p>Carregando o Athenes…</p>
  </div>
  <noscript><style>#athenesInicializacao { display: none; }</style><div class="ath-inicializacao">Ative o JavaScript para abrir o Athenes.</div></noscript>

  <script type="module">
    // Suporte PWA — Instalação e Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('[Athenes PWA] Falha ao registrar Service Worker:', err);
        });
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      const btn = document.getElementById('athBtnInstalarPwa');
      if (btn) btn.style.display = 'inline-flex';
    });

    window.addEventListener('appinstalled', () => {
      window.deferredPwaPrompt = null;
      const btn = document.getElementById('athBtnInstalarPwa');
      if (btn) btn.style.display = 'none';
      if (typeof window.mostrarAviso === 'function') {
        window.mostrarAviso('Athenes instalado com sucesso!', { tipo: 'sucesso' });
      }
    });

    window.addEventListener('error', (e) => {
      console.error('[Athenes Error]', e.error || e.message);
    });

    const iniciarApp = async () => {
      const root = document.getElementById('athenesAppRoot');
      const inicializacao = document.getElementById('athenesInicializacao');
      try {
        const [{ AthenesApp }, { carregarFontesImportadas }] = await Promise.all([
          import('./src/ui/athenes_app.js'),
          import('./src/ui/athenes_fontes_ui.js')
        ]);
        try { await Promise.race([carregarFontesImportadas(), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
        window.athenesApp = new AthenesApp(root);
        inicializacao.setAttribute('aria-hidden', 'true');
        inicializacao.classList.add('ath-inicializacao-saindo');
        inicializacao.addEventListener('animationend', ev => {
          if (ev.target === inicializacao) inicializacao.remove();
        });
      } catch (erro) {
        console.error('[Athenes] Falha ao iniciar:', erro);
        const mensagem = document.createElement('p');
        mensagem.textContent = 'Não foi possível carregar o Athenes.';
        const tentar = document.createElement('button');
        tentar.type = 'button';
        tentar.textContent = 'Tentar novamente';
        tentar.addEventListener('click', () => window.location.reload());
        inicializacao.setAttribute('role', 'alert');
        inicializacao.replaceChildren(mensagem, tentar);
      } finally {
        root.removeAttribute('aria-busy');
      }
    };

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', iniciarApp);
    } else {
      iniciarApp();
    }
  </script>
</body>
</html>
